<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非工程專責機關辦理工程參考手冊</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght=300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* 強制全域隱藏所有捲動軸（但保留原本的捲動功能，確保手機與滑鼠正常使用） */
        * {
            -ms-overflow-style: none !important;  /* IE & Edge */
            scrollbar-width: none !important;  /* Firefox */
        }
        *::-webkit-scrollbar {
            display: none !important; /* Chrome, Safari, Opera */
            width: 0 !important;
            height: 0 !important;
        }

        /* 隱藏任何溢出捲動軸的外顯控制 */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* 全域過渡動畫效果 */
        .theme-transition {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =======================================================
           手冊資料庫 HTML 樣式還原渲染器 (Typography Overrides)
           ======================================================= */
        .manual-content {
            font-size: 0.925rem;
            line-height: 1.8;
        }
        /* 還原無序列表與有序列表的縮排與標記 */
        .manual-content ul {
            list-style-type: disc !important;
            padding-left: 1.75rem !important;
            margin-top: 0.75rem !important;
            margin-bottom: 0.75rem !important;
        }
        .manual-content ol {
            list-style-type: decimal !important;
            padding-left: 1.75rem !important;
            margin-top: 0.75rem !important;
            margin-bottom: 0.75rem !important;
        }
        .manual-content li {
            display: list-item !important;
            margin-bottom: 0.5rem !important;
        }
        /* 還原文字修飾與加粗 */
        .manual-content b, .manual-content strong {
            font-weight: 700 !important;
        }
        .manual-content i, .manual-content em {
            font-style: italic !important;
        }
        .manual-content u {
            text-decoration: underline !important;
        }
        /* 引用框 blockquote 自適應配色與左邊框 */
        .manual-content blockquote {
            border-left: 4px solid #cbd5e1 !important;
            padding: 0.5rem 0 0.5rem 1rem !important;
            margin: 1rem 0 1rem 0.5rem !important;
            color: #475569 !important;
            background-color: rgba(241, 245, 249, 0.6) !important;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        .dark .manual-content blockquote {
            border-left-color: #475569 !important;
            color: #cbd5e1 !important;
            background-color: rgba(30, 41, 59, 0.3) !important;
        }
        /* 超連結預設樣式 */
        .manual-content a {
            color: #4f46e5 !important;
            text-decoration: underline !important;
            font-weight: 500;
        }
        .dark .manual-content a {
            color: #818cf8 !important;
        }
        /* 保持段落行高 */
        .manual-content p {
            margin-top: 0.6rem !important;
            margin-bottom: 0.6rem !important;
        }

        /* 智慧表格亮暗色樣式設定（支援讀取並呈現 JSON 中的表格） */
        .manual-content table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin-top: 1rem !important;
            margin-bottom: 1rem !important;
            border: 1px solid #cbd5e1 !important;
        }
        .dark .manual-content table {
            border-color: #334155 !important;
        }
        .manual-content th {
            border: 1px solid #cbd5e1 !important;
            padding: 8px !important;
            background-color: #f1f5f9 !important;
            font-weight: bold !important;
            text-align: left !important;
        }
        .dark .manual-content th {
            border-color: #334155 !important;
            background-color: #1e293b !important;
        }
        .manual-content td {
            border: 1px solid #cbd5e1 !important;
            padding: 8px !important;
            min-height: 1.5rem !important;
        }
        .dark .manual-content td {
            border-color: #334155 !important;
        }
    </style>
</head>
<body class="theme-transition flex flex-col h-screen overflow-hidden font-sans bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">

    <!-- HEADER 橫幅 -->
    <header class="theme-transition sticky top-0 z-50 flex items-center justify-between px-6 py-4 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/50 dark:border-slate-800/50 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="p-2.5 bg-gradient-to-tr from-emerald-500 to-teal-600 rounded-xl shadow-md text-white">
                <i data-lucide="building-2" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-xl font-extrabold tracking-wide bg-gradient-to-r from-emerald-600 to-indigo-600 dark:from-emerald-400 dark:to-indigo-400 bg-clip-text text-transparent">
                    非工程專責機關辦理工程參考手冊
                </h1>
                <p class="text-xs text-slate-400 dark:text-slate-505 hidden sm:block">智慧階段指引與標準作業程序檢核庫</p>
            </div>
        </div>

        <!-- 搜尋欄、導入/導出資料庫與模式切換 -->
        <div class="flex items-center gap-3 md:gap-4">
            <!-- 快速檢索框 (電腦版) -->
            <div class="relative hidden md:flex items-center">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="搜尋特定要件項目..."
                    oninput="handleSearch(this.value)"
                    class="theme-transition w-44 lg:w-64 px-4 py-2 pl-10 text-xs rounded-full border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 dark:text-slate-100"
                />
                <i data-lucide="search" class="absolute left-3.5 w-4 h-4 text-slate-400"></i>
                <button 
                    id="clearSearchBtn"
                    onclick="clearSearch()"
                    class="absolute right-3.5 text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden"
                >✕</button>
            </div>


            <!-- 選擇範圍並匯出 PDF -->
            <button 
                onclick="openPdfExportModal()"
                class="theme-transition flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-lg bg-indigo-50 dark:bg-indigo-950/40 text-indigo-600 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/40 hover:bg-indigo-100 dark:hover:bg-indigo-900/50" 
                title="選擇特定主要階段並匯出為整套 PDF 文件"
            >
                <i data-lucide="file-text" class="w-4 h-4"></i>
                <span class="hidden lg:inline">匯出 PDF</span>
            </button>

            <!-- 太陽/月亮 深色模式切換按鈕 -->
            <button 
                onclick="toggleTheme()"
                class="theme-transition p-2.5 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-900 dark:hover:bg-slate-800 border border-slate-200/50 dark:border-slate-800/50 text-slate-600 dark:text-amber-400 flex items-center justify-center shadow-inner relative w-10 h-10"
                title="切換顏色主題"
            >
                <div class="relative w-5 h-5 flex items-center justify-center">
                    <i data-lucide="sun" id="sunIcon" class="absolute w-5 h-5 transition-all duration-500 ease-out transform scale-100 rotate-0 opacity-100"></i>
                    <i data-lucide="moon" id="moonIcon" class="absolute w-5 h-5 transition-all duration-500 ease-out transform scale-0 -rotate-90 opacity-0"></i>
                </div>
            </button>
        </div>
  <!-- mobil 支援，連結 manifest.json 以及註冊 Service Worker 的程式碼 -->>     
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="manifest" href="./manifest.json">
  
  <link rel="apple-touch-icon" href="./android-chrome-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="工程手冊 App"> <script>
    // 修正 3：註冊 Service Worker 並明確指定 scope
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(function(registration) {
            console.log('ServiceWorker 註冊成功，Scope: ', registration.scope);
          }).catch(function(err) {
            console.log('ServiceWorker 註冊失敗: ', err);
          });
      });
    }
  </script>
    </header>

    <!-- 手機版快速搜尋條 -->
    <div class="theme-transition p-3 bg-white dark:bg-slate-900 md:hidden border-b border-slate-200 dark:border-slate-800 flex items-center gap-2">
        <div class="relative flex-1">
            <input 
                type="text" 
                id="searchInputMobile"
                placeholder="搜尋項目關鍵字..." 
                oninput="handleSearch(this.value)"
                class="theme-transition w-full px-3 py-1.5 pl-8 text-xs rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 focus:outline-none dark:text-slate-100"
            />
            <i data-lucide="search" class="absolute left-2.5 top-2.5 w-3.5 h-3.5 text-slate-400"></i>
            <button 
                id="clearSearchBtnMobile"
                onclick="clearSearch()" 
                class="absolute right-2.5 top-2 text-xs text-slate-400 hidden"
            >✕</button>
        </div>
    </div>

    <!-- 網頁主要中央工作區域 -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- ====================================
            桌面版版面：三欄並排，比例 17% : 17% : 66%
            ==================================== -->
        <div class="hidden md:flex w-full h-full divide-x divide-slate-200 dark:divide-slate-900">
            
            <!-- 欄位一：第一層次項目 - 主要階段 (佔 17%) -->
            <div class="w-[17%] flex flex-col relative bg-slate-100/40 dark:bg-slate-950/20">
                <div class="p-4 border-b border-slate-200 dark:border-slate-900 bg-white/50 dark:bg-slate-950/40 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-emerald-500"></i>
                    <span class="font-bold text-xs uppercase tracking-wider text-slate-455">第一層：主要階段</span>
                </div>
                
                <!-- 懸停自動捲動：頂部感應區 -->
                <div 
                    onmouseenter="startScroll('col1', -6)"
                    onmouseleave="stopScroll()"
                    class="absolute top-12 left-0 right-0 h-8 bg-gradient-to-b from-slate-50 dark:from-slate-950 to-transparent z-10 cursor-n-resize flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
                >
                    <i data-lucide="arrow-up" class="w-4 h-4 text-emerald-500 animate-bounce"></i>
                </div>

                <!-- 列表內容區 -->
                <div id="col1" class="no-scrollbar flex-1 overflow-y-auto p-3 space-y-2.5 scroll-smooth animate-fade-in">
                    <!-- JavaScript 動態渲染 -->
                </div>

                <!-- 懸停自動捲動：底部感應區 -->
                <div 
                    onmouseenter="startScroll('col1', 6)"
                    onmouseleave="stopScroll()"
                    class="absolute bottom-0 left-0 right-0 h-8 bg-gradient-to-t from-slate-50 dark:from-slate-950 to-transparent z-10 cursor-s-resize flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
                >
                    <i data-lucide="arrow-down" class="w-4 h-4 text-emerald-500 animate-bounce"></i>
                </div>
            </div>

            <!-- 欄位二：第二層次項目 - 注意事項 (佔 17%) -->
            <div class="w-[17%] flex flex-col relative bg-slate-50 dark:bg-slate-950">
                <div class="p-4 border-b border-slate-200 dark:border-slate-900 bg-white/50 dark:bg-slate-950/40 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="database" class="w-4 h-4 text-indigo-500"></i>
                        <span class="font-bold text-xs uppercase tracking-wider text-slate-455">第二層：作業項目</span>
                    </div>
                    <span id="col2Counter" class="text-[10px] bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-full font-semibold border border-indigo-100 dark:border-indigo-900/40 hidden">
                        0 項
                    </span>
                </div>

                <!-- 懸停自動捲動：頂部感應區 -->
                <div 
                    onmouseenter="startScroll('col2', -6)"
                    onmouseleave="stopScroll()"
                    class="absolute top-12 left-0 right-0 h-8 bg-gradient-to-b from-slate-50 dark:from-slate-950 to-transparent z-10 cursor-n-resize flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
                >
                    <i data-lucide="arrow-up" class="w-4 h-4 text-indigo-500 animate-bounce"></i>
                </div>

                <!-- 列表內容區 -->
                <div id="col2" class="no-scrollbar flex-1 overflow-y-auto p-3 space-y-2 scroll-smooth">
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs py-12">
                        <i data-lucide="book-open" class="w-8 h-8 text-slate-300 dark:text-slate-700 mb-2"></i>
                        <span>請先選擇左側主要階段</span>
                    </div>
                </div>

                <!-- 懸停自動捲動：底部感應區 -->
                <div 
                    onmouseenter="startScroll('col2', 6)"
                    onmouseleave="stopScroll()"
                    class="absolute bottom-0 left-0 right-0 h-8 bg-gradient-to-t from-white dark:from-slate-950 to-transparent z-10 cursor-s-resize flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
                >
                    <i data-lucide="arrow-down" class="w-4 h-4 text-indigo-500 animate-bounce"></i>
                </div>
            </div>

            <!-- 欄位三：第三層次項目 - 重點提示及說明 (佔 66%) -->
            <div class="w-[66%] flex flex-col relative bg-white dark:bg-slate-900">
                <div class="p-4 border-b border-slate-200 dark:border-slate-800/85 bg-slate-50/50 dark:bg-slate-905 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="info" class="w-4 h-4 text-emerald-500"></i>
                        <span class="font-bold text-xs uppercase tracking-wider text-slate-455">重點提示及說明</span>
                    </div>
                    <!-- 一鍵複製與列印整合按鈕組 -->
                    <div id="col3-actions" class="flex items-center gap-2 opacity-0 pointer-events-none transition-opacity duration-300">
                        <button onclick="copyCurrentContent()" class="theme-transition p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-850 text-slate-550 dark:text-slate-400 flex items-center justify-center shadow-sm" title="複製本文文字">
                            <i data-lucide="copy" class="w-4 h-4"></i>
                        </button>
                        <button onclick="printCurrentContent()" class="theme-transition p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-850 text-slate-550 dark:text-slate-400 flex items-center justify-center shadow-sm" title="排版列印此指南">
                            <i data-lucide="printer" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- 懸停自動捲動：頂部感應區 -->
                <div 
                    onmouseenter="startScroll('col3', -8)"
                    onmouseleave="stopScroll()"
                    class="absolute top-12 left-0 right-0 h-8 bg-gradient-to-b from-white dark:from-slate-900 to-transparent z-10 cursor-n-resize flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
                >
                    <i data-lucide="arrow-up" class="w-4 h-4 text-emerald-500 animate-bounce"></i>
                </div>

                <!-- 詳細內容容器 -->
                <div id="col3" class="no-scrollbar flex-1 overflow-y-auto p-6 md:p-8 relative scroll-smooth">
                    <div class="h-full flex flex-col items-center justify-center text-center py-24 space-y-4">
                        <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-full border border-slate-200/50 dark:border-slate-800">
                            <i data-lucide="database" class="w-12 h-12 text-slate-300 dark:text-slate-700"></i>
                        </div>
                        <div>
                            <h3 class="text-base font-bold text-slate-700 dark:text-slate-300">待命查詢中</h3>
                            <p class="text-xs text-slate-400 dark:text-slate-505 max-w-sm mt-1.5 leading-relaxed">
                                請點擊左側主要階段及作業項目，系統將依點擊動態顯示重點提示及說明。
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 懸停自動捲動：底部感應區 -->
                <div 
                    onmouseenter="startScroll('col3', 8)"
                    onmouseleave="stopScroll()"
                    class="absolute bottom-0 left-0 right-0 h-8 bg-gradient-to-t from-white dark:from-slate-900 to-transparent z-10 cursor-s-resize flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity"
                >
                    <i data-lucide="arrow-down" class="w-4 h-4 text-emerald-500 animate-bounce"></i>
                </div>
            </div>
        </div>

        <!-- ====================================
            行動裝置版面
            ==================================== -->
        <div class="md:hidden flex flex-col w-full h-full relative">
            <div id="mobileNav" class="theme-transition px-4 py-2 bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs">
                <button 
                    id="mobileBackBtn"
                    onclick="handleMobileBack()"
                    class="flex items-center gap-1 font-semibold text-emerald-600 dark:text-emerald-400 invisible"
                >
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> 返回
                </button>
                <span id="mobileStepIndicator" class="text-slate-400 font-bold">主要階段</span>
            </div>

            <div class="flex-1 relative overflow-hidden">
                <div id="mobileL1" class="no-scrollbar absolute inset-0 p-4 space-y-3 overflow-y-auto"></div>
                <div id="mobileL2" class="no-scrollbar absolute inset-0 p-4 space-y-2 overflow-y-auto hidden"></div>
                <div id="mobileL3" class="no-scrollbar absolute inset-0 p-5 overflow-y-auto bg-white dark:bg-slate-900 hidden"></div>
            </div>
        </div>

    </main>

    <!-- PDF 匯出選擇彈出視窗 (Modal) -->
    <div id="pdfExportModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden" style="transition: all 0.3s ease-out;">
        <div class="theme-transition bg-white dark:bg-slate-900 rounded-2xl max-w-lg w-full border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col max-h-[85vh]">
            <!-- 彈出窗標頭 -->
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-950/50 rounded-t-2xl">
                <div class="flex items-center gap-2">
                    <i data-lucide="printer" class="w-5 h-5 text-indigo-500"></i>
                    <h3 class="text-base font-bold text-slate-800 dark:text-slate-100">選擇匯出 PDF 範圍</h3>
                </div>
                <button onclick="closePdfExportModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <!-- 彈出窗內容區 -->
            <div class="p-6 overflow-y-auto space-y-4">
                <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                    請選取欲合併匯出為 PDF 文件的主要階段，系統將彙整所選階段內的所有作業項目及詳細指引內容。
                </p>
                <!-- 全選/全不選快速鍵 -->
                <div class="flex gap-2">
                    <button onclick="setPdfSelections(true)" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md transition-colors shadow-sm">
                        全選
                    </button>
                    <button onclick="setPdfSelections(false)" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-md transition-colors shadow-sm">
                        全不選
                    </button>
                </div>
                <!-- 動態生成的階段核取清單 -->
                <div id="pdfStagesList" class="space-y-2 border border-slate-100 dark:border-slate-800 p-3 rounded-xl bg-slate-50/50 dark:bg-slate-950/20 max-h-[30vh] overflow-y-auto">
                    <!-- JS 動態生成 -->
                </div>
            </div>

            <!-- 彈出窗底部按鈕 -->
            <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/50 rounded-b-2xl flex justify-end gap-3">
                <button onclick="closePdfExportModal()" class="px-4 py-2 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    取消
                </button>
                <button onclick="executePdfExport()" class="px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-600/10 transition-all flex items-center gap-1.5">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    確認匯出 PDF
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER 橫幅 -->
    <footer class="theme-transition py-3 px-6 bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-900 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400 dark:text-slate-505">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="statusPulse"></span>
            <span id="dbStatusLabel">資料庫狀態：載入中...</span>
        </div>
        <div>
          <span>© 2026 法務部秘書處 版權所有.</span>
        </div>
    </footer>

    <!-- JS 邏輯區 -->
    <script>
        // =======================================================
        // 【1. 資料定義區】動態載入式系統，無硬編碼大綱
        // =======================================================
        const initialPreloadRaw = {}; // 系統初始為空，靜態大綱已被取消

        // =======================================================
        // 【項目 1 優化】定義雙端整合共享之「列印與 PDF」唯讀 CSS 樣式表
        // =======================================================
        const SHARED_PRINT_CSS = `
            @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
            body {
                font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
                color: #1e293b;
                line-height: 1.8;
                background-color: #ffffff;
            }
            .manual-content {
                font-size: 13.5px;
                text-align: justify;
            }
            .manual-content ul {
                list-style-type: disc !important;
                padding-left: 20px !important;
                margin: 10px 0 !important;
            }
            .manual-content ol {
                list-style-type: decimal !important;
                padding-left: 20px !important;
                margin: 10px 0 !important;
            }
            .manual-content li {
                margin-bottom: 6px !important;
            }
            b, strong {
                font-weight: bold;
            }
            blockquote {
                border-left: 4px solid #cbd5e1;
                padding: 8px 12px;
                margin: 15px 0;
                color: #475569;
                font-style: italic;
                background-color: #f1f5f9;
                border-radius: 0 6px 6px 0;
            }
            a {
                color: #2563eb;
                text-decoration: underline;
            }
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                margin-top: 15px !important;
                margin-bottom: 15px !important;
                border: 1px solid #cbd5e1 !important;
            }
            th {
                border: 1px solid #cbd5e1 !important;
                padding: 8px 10px !important;
                background-color: #f1f5f9 !important;
                font-weight: bold !important;
                text-align: left !important;
            }
            td {
                border: 1px solid #cbd5e1 !important;
                padding: 8px 10px !important;
            }
        `;

        // =======================================================
        // 【2. 狀態管理區】
        // =======================================================
        let mockCloudDatabase = {}; // 當前與 UI 繫結的工程手冊資料庫主體

        const state = {
            theme: 'light',      // 當前色彩主題：'light' | 'dark'
            selectedL1: null,     // 當前選定之第一層主要階段名稱 (String)
            selectedL2: '',       // 當前選定之第二層細部作業項目名稱 (String)
            searchQuery: '',      // 當前篩選之關鍵字 (String)
            mobileView: 'l1'      // 行動裝置專屬視圖指標：'l1' | 'l2' | 'l3'
        };

        // =======================================================
        // 【項目 2 優化】宣告 DOM 快取暫存物件
        // =======================================================
        const dom = {};

        /**
         * 於系統初始化階段，一次性提取並快取常用的 DOM 元素節點，避免重複進行 getElementById
         */
        function initDomCache() {
            dom.col1 = document.getElementById('col1');
            dom.col2 = document.getElementById('col2');
            dom.col3 = document.getElementById('col3');
            dom.col2Counter = document.getElementById('col2Counter');
            dom.col3Actions = document.getElementById('col3-actions');
            dom.mobileL1 = document.getElementById('mobileL1');
            dom.mobileL2 = document.getElementById('mobileL2');
            dom.mobileL3 = document.getElementById('mobileL3');
            dom.mobileBackBtn = document.getElementById('mobileBackBtn');
            dom.mobileStepIndicator = document.getElementById('mobileStepIndicator');
            dom.searchInput = document.getElementById('searchInput');
            dom.searchInputMobile = document.getElementById('searchInputMobile');
            dom.clearSearchBtn = document.getElementById('clearSearchBtn');
            dom.clearSearchBtnMobile = document.getElementById('clearSearchBtnMobile');
            dom.dbStatusLabel = document.getElementById('dbStatusLabel');
            dom.statusPulse = document.getElementById('statusPulse');
            dom.pdfStagesList = document.getElementById('pdfStagesList');
            dom.pdfExportModal = document.getElementById('pdfExportModal');
        }

        // =======================================================
        // 【3. 核心業務與智慧判定邏輯】
        // =======================================================

        /**
         * 智慧大綱完全動態生成引擎 (Dynamic Menu Generator & Merger)
         * 取消硬編碼的大綱對位，100% 依據匯入的 JSON 直接設定大綱
         */
        function mergeDatabase(importedJSON) {
            if (!importedJSON || typeof importedJSON !== 'object' || Object.keys(importedJSON).length === 0) {
                mockCloudDatabase = {};
                return;
            }
            
            // 直接以匯入之 JSON 建置 mockCloudDatabase 實體結構
            mockCloudDatabase = {};
            for (const stageName in importedJSON) {
                mockCloudDatabase[stageName] = {};
                const stageData = importedJSON[stageName];
                if (stageData && typeof stageData === 'object') {
                    for (const itemName in stageData) {
                        const itemData = stageData[itemName];
                        if (itemData && typeof itemData === 'object') {
                            mockCloudDatabase[stageName][itemName] = {
                                code: itemData.code || "",
                                author: itemData.author || "秘書處",
                                updateDate: itemData.updateDate || "",
                                content: itemData.content || ""
                            };
                        } else {
                            mockCloudDatabase[stageName][itemName] = null;
                        }
                    }
                }
            }
        }

        /**
         * 智慧過濾器：檢定項目之 content 是否空缺或為「系統預設模版文字」
         * @param {string} content - 富文本內文
         * @returns {boolean}
         */
        function isContentEmptyOrDefault(content) {
            if (!content) return true;
            // 剝除 HTML 標籤與全域空白符號，進行純文字特徵比對
            const plainText = content.replace(/<[^>]*>/g, '').replace(/\s+/g, '').trim();
            const defaultPattern = "請在此編輯該項目適用採購金額的重點提示及說明、常見缺失指引或相關表單與參考連結...".replace(/\s+/g, '').trim();
            
            return plainText === "" || plainText.includes(defaultPattern);
        }

        /**
         * 取得特定主要階段與細部作業項目對應的資料庫條目
         */
        function getDatabaseEntry(selectedL1, itemName) {
            if (!selectedL1 || !mockCloudDatabase[selectedL1]) return null;
            return mockCloudDatabase[selectedL1][itemName];
        }

        /**
         * 系統偏好主題初始化
         */
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            state.theme = savedTheme;
            applyTheme();
        }

        /**
         * 切換顏色模式
         */
        function toggleTheme() {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', state.theme);
            applyTheme();
        }

        /**
         * 將主題狀態渲染至實體 DOM 樹
         */
        function applyTheme() {
            const html = document.documentElement;
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');

            if (state.theme === 'dark') {
                html.classList.add('dark');
                sunIcon.classList.remove('scale-100', 'rotate-0', 'opacity-100');
                sunIcon.classList.add('scale-0', 'rotate-90', 'opacity-0');
                moonIcon.classList.remove('scale-0', '-rotate-90', 'opacity-0');
                moonIcon.classList.add('scale-100', 'rotate-0', 'opacity-100');
            } else {
                html.classList.remove('dark');
                sunIcon.classList.remove('scale-0', 'rotate-90', 'opacity-0');
                sunIcon.classList.add('scale-100', 'rotate-0', 'opacity-100');
                moonIcon.classList.remove('scale-100', 'rotate-0', 'opacity-100');
                moonIcon.classList.add('scale-0', '-rotate-90', 'opacity-0');
            }
        }

        /**
         * 滾動感應處理：側欄滑鼠懸停觸發自動滑行
         */
        let scrollInterval = null;
        function startScroll(elementId, speed) {
            if (scrollInterval) clearInterval(scrollInterval);
            const container = document.getElementById(elementId);
            if (!container) return;
            
            scrollInterval = setInterval(() => {
                container.scrollTop += speed;
            }, 12);
        }

        /**
         * 終止當前滾動定時器
         */
        function stopScroll() {
            if (scrollInterval) {
                clearInterval(scrollInterval);
                scrollInterval = null;
            }
        }

        // =======================================================
        // 【項目 3 優化】雙端即時搜尋同步邏輯與狀態重組
        // =======================================================

        /**
         * 一手掌控雙端輸入值之同步與清除按鈕（✕）狀態切換
         */
        function updateSearchUI() {
            const query = state.searchQuery;

            // 雙端輸入值同步，避免回饋迴圈
            if (dom.searchInput && dom.searchInput.value !== query) {
                dom.searchInput.value = query;
            }
            if (dom.searchInputMobile && dom.searchInputMobile.value !== query) {
                dom.searchInputMobile.value = query;
            }

            // 清除按鈕之狀態顯隱
            if (query) {
                dom.clearSearchBtn?.classList.remove('hidden');
                dom.clearSearchBtnMobile?.classList.remove('hidden');
            } else {
                dom.clearSearchBtn?.classList.add('hidden');
                dom.clearSearchBtnMobile?.classList.add('hidden');
            }
        }

        /**
         * 雙端即時關鍵字搜尋主要調度器
         */
        function handleSearch(val) {
            state.searchQuery = (val || '').trim();
            
            // 呼叫優化後的雙端 UI 同步控制
            updateSearchUI();

            // 防禦處理：若無資料庫，直接終止重繪選單
            if (Object.keys(mockCloudDatabase).length === 0) return;

            renderL2();
            if (state.mobileView === 'l2') {
                renderMobileL2();
            }
            
            if (state.selectedL2) {
                const dbEntry = getDatabaseEntry(state.selectedL1, state.selectedL2);
                if (dbEntry && dbEntry.content) {
                    renderL3Data(dbEntry);
                }
            }
        }

        function clearSearch() {
            handleSearch('');
        }

        function getFilteredItems(items) {
            if (!state.searchQuery) return items;
            return items.filter(item => item.toLowerCase().includes(state.searchQuery.toLowerCase()));
        }

        // =======================================================
        // 【4. 桌面端 UI 渲染模組】
        // =======================================================

        function handleL1Click(stageName) {
            state.selectedL1 = stageName;
            state.selectedL2 = ''; 
            
            resetL3();
            renderL1();
            renderL2();

            state.mobileView = 'l2';
            updateMobileView();
        }

        function renderL1() {
            const container = dom.col1;
            if (!container) return;
            
            let html = '';
            const stages = Object.keys(mockCloudDatabase);
            
            if (stages.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400 dark:text-slate-500">無大綱資料</div>`;
                return;
            }

            stages.forEach(stageName => {
                const isSelected = state.selectedL1 === stageName;
                const activeClasses = isSelected 
                    ? 'bg-emerald-500 text-white border-emerald-500 shadow-md shadow-emerald-500/20 scale-[1.02]' 
                    : 'bg-white dark:bg-slate-900 border-slate-200/60 dark:border-slate-800 hover:border-emerald-500/60 hover:text-emerald-500 hover:scale-[1.02] dark:text-slate-300';
                
                html += `
                    <button
                        onclick="handleL1Click('${stageName}')"
                        class="theme-transition w-full text-left p-4 rounded-xl text-sm font-semibold transform border flex justify-between items-center ${activeClasses}"
                    >
                        <span class="line-clamp-2 leading-relaxed">${stageName}</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 flex-shrink-0"></i>
                    </button>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function renderL2() {
            const container = dom.col2;
            const counter = dom.col2Counter;
            if (!container) return;
            
            if (!state.selectedL1 || Object.keys(mockCloudDatabase).length === 0) {
                if (counter) counter.classList.add('hidden');
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs py-12">
                        <i data-lucide="book-open" class="w-8 h-8 text-slate-300 dark:text-slate-700 mb-2"></i>
                        <span>請先選擇左側主要階段</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const rawItems = mockCloudDatabase[state.selectedL1] ? Object.keys(mockCloudDatabase[state.selectedL1]) : [];
            const filteredItems = getFilteredItems(rawItems);
            
            if (counter) {
                counter.classList.remove('hidden');
                counter.textContent = `共 ${filteredItems.length} 項`;
            }

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs py-12">
                        <i data-lucide="alert-triangle" class="w-8 h-8 text-slate-300 dark:text-slate-700 mb-2"></i>
                        <span>無相符的搜尋項目</span>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let html = '';
            filteredItems.forEach(item => {
                const isSelected = state.selectedL2 === item;
                const dbMatch = getDatabaseEntry(state.selectedL1, item);
                
                // 智慧比對：是否為有效編輯過的內容 (非空且非系統預設文字)
                const hasRealContent = dbMatch && dbMatch.content && !isContentEmptyOrDefault(dbMatch.content);
                
                const badgeHtml = hasRealContent 
                    ? `<span class="px-1.5 py-0.5 bg-emerald-50 dark:bg-emerald-950/40 text-[9px] text-emerald-600 dark:text-emerald-400 rounded border border-emerald-200/40 font-bold">已編輯</span>` 
                    : `<span class="px-1.5 py-0.5 bg-amber-50 dark:bg-amber-950/20 text-[9px] text-amber-600 dark:text-amber-505 rounded border border-amber-200/40 font-semibold">空白</span>`;

                const activeClasses = isSelected
                    ? 'bg-indigo-600 text-white border-indigo-600 shadow-md shadow-indigo-600/20 scale-[1.02]'
                    : 'bg-white dark:bg-slate-900 border-slate-200/50 dark:border-slate-800 hover:border-indigo-400 hover:text-indigo-500 dark:text-slate-300 hover:scale-[1.015]';

                html += `
                    <button
                        onclick="handleL2Click('${item}')"
                        class="theme-transition w-full text-left p-3.5 rounded-xl text-xs font-medium transform border flex items-center justify-between gap-2 ${activeClasses}"
                    >
                        <span class="line-clamp-2 leading-relaxed flex-1">${item}</span>
                        <div class="flex items-center flex-shrink-0">${badgeHtml}</div>
                    </button>
                `;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        function handleL2Click(itemName) {
            state.selectedL2 = itemName;
            renderL2();

            state.mobileView = 'l3';
            updateMobileView();

            renderL3Loading();

            setTimeout(() => {
                if (state.selectedL2 !== itemName) return; 

                const dbEntry = getDatabaseEntry(state.selectedL1, itemName);

                // 若內容不存在、為空，或包含預設範本文字，則不於「重點提示及說明」區顯示任何內容
                if (dbEntry && dbEntry.content && !isContentEmptyOrDefault(dbEntry.content)) {
                    renderL3Data(dbEntry);
                } else {
                    const actionContainer = dom.col3Actions;
                    if (actionContainer) actionContainer.classList.add('opacity-0', 'pointer-events-none');
                    const c3 = dom.col3;
                    const mc3 = dom.mobileL3;
                    if (c3) c3.innerHTML = '';
                    if (mc3) mc3.innerHTML = '';
                }
            }, 150);
        }

        function renderL3Loading() {
            const actionContainer = dom.col3Actions;
            if (actionContainer) actionContainer.classList.add('opacity-0', 'pointer-events-none');

            const skeletonHtml = `
                <div class="space-y-6 animate-pulse">
                    <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded-md w-1/4"></div>
                    <div class="h-10 bg-slate-200 dark:bg-slate-800 rounded-md w-3/4"></div>
                    <div class="space-y-3 pt-4">
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded-md w-full"></div>
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded-md w-11/12"></div>
                        <div class="h-4 bg-slate-200 dark:bg-slate-800 rounded-md w-5/6"></div>
                    </div>
                    <div class="h-32 bg-slate-200 dark:bg-slate-800 rounded-xl w-full mt-6"></div>
                </div>
            `;
            const c3 = dom.col3;
            const mc3 = dom.mobileL3;
            if (c3) c3.innerHTML = skeletonHtml;
            if (mc3) mc3.innerHTML = skeletonHtml;
        }

        function renderL3NoContentTemplate(itemName) {
            const emptyObj = {
                code: "N/A",
                author: "秘書處",
                updateDate: new Date().toISOString().split('T')[0],
                content: `
                    <div class="space-y-4">
                        <div class="p-5 bg-amber-50 dark:bg-amber-950/20 rounded-xl border border-amber-200 dark:border-amber-800/60 shadow-inner">
                            <div class="flex items-center gap-2.5 text-amber-800 dark:text-amber-400 mb-2 font-bold text-sm">
                                <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 text-amber-500"></i>
                                <span>📋 尚待編輯（本項目暫無詳細指引內文）</span>
                            </div>
                            <p class="text-xs text-slate-655 dark:text-slate-300 leading-relaxed">
                                此作業項目「<span class="text-indigo-600 dark:text-indigo-400 font-semibold">${itemName}</span>」之細節指南在目前的 JSON 檔案中尚未完成編輯登載。
                            </p>
                        </div>
                    </div>
                `
            };
            renderL3Data(emptyObj);
        }

        function highlightText(html, query) {
            if (!query) return html;
            const safeQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'); 
            const regex = new RegExp(`(${safeQuery})`, 'gi');
            
            const parts = html.split(/(<[^>]+>)/g);
            return parts.map(part => {
                if (part.startsWith('<')) return part; 
                return part.replace(regex, `<mark class="bg-yellow-200 dark:bg-yellow-800/80 text-slate-900 dark:text-slate-100 rounded-sm px-0.5">$1</mark>`);
            }).join('');
        }

        function renderL3Data(detail) {
            const actionContainer = dom.col3Actions;
            if (actionContainer) actionContainer.classList.remove('opacity-0', 'pointer-events-none');

            const hasMeta = detail.code || detail.author || detail.updateDate;
            const highlightedHtmlContent = highlightText(detail.content, state.searchQuery);

            const contentHtml = `
                <div class="space-y-6">
                    <div>
                        <div class="mb-2.5 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200/40 text-xs font-bold text-emerald-600 dark:text-emerald-400">
                            <i data-lucide="folder" class="w-3.5 h-3.5"></i>
                            <span>${state.selectedL1}</span>
                        </div>
                        <h2 class="text-2xl font-black text-slate-800 dark:text-slate-50 tracking-tight leading-snug">
                            ${state.selectedL2}
                        </h2>
                    </div>

                    <div id="col3-main-content" class="manual-content text-slate-655 dark:text-slate-300">
                        ${highlightedHtmlContent}
                    </div>

                    ${hasMeta ? `
                    <div class="pt-6 border-t border-slate-200/60 dark:border-slate-800/60 flex flex-wrap items-center gap-2.5 text-xs text-slate-400 dark:text-slate-505">
                        ${detail.code && detail.code !== "N/A" ? `<span class="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-600 dark:text-slate-300 font-mono">編號: ${detail.code}</span>` : ''}
                        ${detail.updateDate ? `<span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i>最後更新: ${detail.updateDate}</span>` : ''}
                        ${detail.author ? `<span class="px-2.5 py-1 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 rounded-full font-semibold">發布單位: ${detail.author}</span>` : ''}
                    </div>` : ''}
                </div>
            `;
            
            const c3 = dom.col3;
            const mc3 = dom.mobileL3;
            if (c3) c3.innerHTML = contentHtml;
            if (mc3) mc3.innerHTML = contentHtml;
            lucide.createIcons();
        }

        function resetL3() {
            const actionContainer = dom.col3Actions;
            if (actionContainer) actionContainer.classList.add('opacity-0', 'pointer-events-none');

            const defaultL3Html = `
                <div class="h-full flex flex-col items-center justify-center text-center py-24 space-y-4">
                    <div class="p-4 bg-slate-50 dark:bg-slate-900 rounded-full border border-slate-200/50 dark:border-slate-800">
                        <i data-lucide="database" class="w-12 h-12 text-slate-300 dark:text-slate-700"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-slate-700 dark:text-slate-300">待命查詢中</h3>
                        <p class="text-xs text-slate-400 dark:text-slate-505 max-w-sm mt-1.5 leading-relaxed">
                            請點擊左側主要階段及作業項目，系統將依點擊動態抓取重點提示及說明。
                        </p>
                    </div>
                </div>
            `;
            const c3 = dom.col3;
            const mc3 = dom.mobileL3;
            if (c3) c3.innerHTML = defaultL3Html;
            if (mc3) mc3.innerHTML = '';
            lucide.createIcons();
        }

        // =======================================================
        // 【5. 行動裝置 UI 渲染模組】
        // =======================================================

        function updateMobileView() {
            const l1Container = dom.mobileL1;
            const l2Container = dom.mobileL2;
            const l3Container = dom.mobileL3;
            const backBtn = dom.mobileBackBtn;
            const indicator = dom.mobileStepIndicator;

            if (!l1Container || !l2Container || !l3Container || !backBtn || !indicator) return;

            l1Container.classList.add('hidden');
            l2Container.classList.add('hidden');
            l3Container.classList.add('hidden');

            if (state.mobileView === 'l1') {
                l1Container.classList.remove('hidden');
                backBtn.classList.add('invisible');
                indicator.textContent = '主要階段';
                renderMobileL1();
            } else if (state.mobileView === 'l2') {
                l2Container.classList.remove('hidden');
                backBtn.classList.remove('invisible');
                indicator.textContent = '作業項目';
                renderMobileL2();
            } else if (state.mobileView === 'l3') {
                l3Container.classList.remove('hidden');
                backBtn.classList.remove('invisible');
                indicator.textContent = '重點提示及說明';
            }
            lucide.createIcons();
        }

        function handleMobileBack() {
            if (state.mobileView === 'l3') {
                state.mobileView = 'l2';
            } else if (state.mobileView === 'l2') {
                state.mobileView = 'l1';
            }
            updateMobileView();
        }

        function renderMobileL1() {
            const container = dom.mobileL1;
            if (!container) return;
            
            let html = '';
            const stages = Object.keys(mockCloudDatabase);
            
            if (stages.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-400 text-xs">
                        請匯入最新手冊以啟動查詢功能
                    </div>`;
                return;
            }

            stages.forEach(stageName => {
                html += `
                    <button
                        onclick="handleL1Click('${stageName}')"
                        class="w-full text-left p-4 rounded-xl text-sm font-bold bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 active:bg-slate-100 dark:active:bg-slate-800 flex justify-between items-center text-slate-700 dark:text-slate-300 shadow-sm"
                    >
                        <span>${stageName}</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                    </button>
                `;
            });
            container.innerHTML = html;
        }

        function renderMobileL2() {
            const container = dom.mobileL2;
            if (!container || !state.selectedL1) return;

            const rawItems = mockCloudDatabase[state.selectedL1] ? Object.keys(mockCloudDatabase[state.selectedL1]) : [];
            const filteredItems = getFilteredItems(rawItems);
            
            let html = `
                <div class="text-xs text-slate-400 dark:text-slate-505 mb-2 px-1 font-semibold">
                    當前階段：${state.selectedL1}
                </div>
            `;

            if (filteredItems.length === 0) {
                html += `
                    <div class="text-center py-12 text-slate-400 text-xs">
                        查無篩選結果
                    </div>
                `;
            } else {
                filteredItems.forEach(item => {
                    const dbMatch = getDatabaseEntry(state.selectedL1, item);
                    const hasRealContent = dbMatch && dbMatch.content && !isContentEmptyOrDefault(dbMatch.content);
                    const badgeText = hasRealContent ? "已編輯" : "空白";
                    const badgeColor = hasRealContent ? "text-emerald-500 font-bold" : "text-amber-500 font-semibold";
                    
                    html += `
                        <button
                            onclick="handleL2Click('${item}')"
                            class="theme-transition w-full text-left p-3.5 rounded-xl text-xs font-medium bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 active:bg-slate-100 dark:active:bg-slate-800 flex items-center justify-between text-slate-700 dark:text-slate-300 shadow-sm"
                        >
                            <span class="line-clamp-2 mr-2 flex-1">${item}</span>
                            <span class="${badgeColor} text-[10px] whitespace-nowrap mr-1">${badgeText}</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0"></i>
                        </button>
                    `;
                });
            }
            container.innerHTML = html;
        }

        // =======================================================
        // 【6. 印務與剪貼簿公用工具】
        // =======================================================

        function copyCurrentContent() {
            const contentArea = document.getElementById('col3-main-content');
            if (!contentArea) return;
            
            const plainText = contentArea.innerText;
            const textarea = document.createElement('textarea');
            textarea.value = plainText;
            textarea.style.position = 'fixed'; 
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showNotification("✓ 複製成功", "項目指引內容已成功複製至您的剪貼簿。");
            } catch (err) {
                showNotification("✕ 複製失敗", "您的瀏覽器權限受限，請直接框選文字複製。");
            }
            document.body.removeChild(textarea);
        }

        // =======================================================
        // 【項目 1 優化】微調重置後的 printCurrentContent 函數
        // =======================================================
        function printCurrentContent() {
            const contentArea = document.getElementById('col3-main-content');
            if (!contentArea) return;
            
            const printWin = window.open('', '', 'width=850,height=700');
            if (!printWin) {
                showNotification("✕ 攔截視窗", "列印視窗已被瀏覽器封鎖，請允許快顯視窗再行嘗試。");
                return;
            }

            // 引入共享 CSS，大幅優化冗餘代碼空間
            const style = `
                <style>
                    ${SHARED_PRINT_CSS}
                    body { padding: 40px; }
                    .stage-title { font-size: 13px; font-weight: 700; color: #059669; border: 1px solid #a7f3d0; background-color: #ecfdf5; padding: 4px 10px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
                    h1 { font-size: 26px; font-weight: 900; border-bottom: 3px solid #10b981; padding-bottom: 12px; margin-top: 4px; margin-bottom: 16px; color: #0f766e; }
                    .meta { font-size: 13px; color: #64748b; margin-top: 24px; padding-top: 16px; border-top: 1px dashed #cbd5e1; display: flex; flex-wrap: wrap; gap: 15px; }
                    .manual-content { font-size: 15px; }
                </style>
            `;
            const dbEntry = getDatabaseEntry(state.selectedL1, state.selectedL2) || {};
            const stageHtml = `<div class="stage-title">主要階段：${state.selectedL1}</div>`;
            const headerHtml = `<h1>${state.selectedL2}</h1>`;
            const metaHtml = `
                <div class="meta">
                    ${dbEntry.code ? `<span><b>項目編號：</b>${dbEntry.code}</span>` : ''}
                    ${dbEntry.updateDate ? `<span><b>最後更新：</b>${dbEntry.updateDate}</span>` : ''}
                    ${dbEntry.author ? `<span><b>發布單位：</b>${dbEntry.author}</span>` : ''}
                </div>
            `;
            
            printWin.document.write('<html><head><title>列印項目 - ' + state.selectedL2 + '</title>' + style + '</head><body>' + stageHtml + headerHtml + '<div class="manual-content">' + contentArea.innerHTML + '</div>' + metaHtml + '</body></html>');
            printWin.document.close();
            printWin.focus();
            
            setTimeout(() => {
                printWin.print();
                printWin.close();
            }, 250);
        }

        // =======================================================
        // 【7. 智慧 PDF 彈出導出引擎】
        // =======================================================

        function openPdfExportModal() {
            const stages = Object.keys(mockCloudDatabase);
            if (stages.length === 0) {
                showNotification("⚠️ 匯出提示", "目前尚無手冊資料，請點選「匯入 JSON」以啟動大綱。");
                return;
            }

            const container = dom.pdfStagesList;
            let html = '';
            stages.forEach((stage, idx) => {
                html += `
                    <label class="flex items-start gap-3 p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800/60 cursor-pointer transition-colors border border-transparent hover:border-slate-200 dark:hover:border-slate-800">
                        <input type="checkbox" value="${stage}" checked class="mt-0.5 w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900" />
                        <span class="text-xs font-bold text-slate-700 dark:text-slate-300 leading-normal">${stage}</span>
                    </label>
                `;
            });
            container.innerHTML = html;

            dom.pdfExportModal?.classList.remove('hidden');
            lucide.createIcons();
        }

        function closePdfExportModal() {
            dom.pdfExportModal?.classList.add('hidden');
        }

        function setPdfSelections(checked) {
            const list = dom.pdfStagesList;
            if (!list) return;
            const checkboxes = list.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => {
                cb.checked = checked;
            });
        }

        // =======================================================
        // 【項目 1 優化】微調重置後的 executePdfExport 函數
        // =======================================================
        function executePdfExport() {
            const list = dom.pdfStagesList;
            if (!list) return;
            const checkboxes = list.querySelectorAll('input[type="checkbox"]:checked');
            if (checkboxes.length === 0) {
                showNotification("⚠️ 提示", "請至少勾選一個主要階段進行導出列印。");
                return;
            }

            const selectedStages = Array.from(checkboxes).map(cb => cb.value);
            closePdfExportModal();

            const printWin = window.open('', '', 'width=900,height=800');
            if (!printWin) {
                showNotification("✕ 阻擋視窗", "PDF 整合視窗已被瀏覽器封鎖，請啟用允許彈出視窗。");
                return;
            }

            // 組裝政府格式化富文本列印內容
            let contentHtml = '';
            selectedStages.forEach((stage, sIdx) => {
                const stageData = mockCloudDatabase[stage] || {};
                const items = Object.keys(stageData);

                contentHtml += `
                    <div class="stage-section" style="${sIdx > 0 ? 'page-break-before: always;' : ''}">
                        <div class="stage-header">主要階段：${stage}</div>
                        <hr class="stage-divider" />
                `;

                if (items.length === 0) {
                    contentHtml += `<p style="color: #94a3b8; font-style: italic; font-size: 14px;">此階段無作業項目。</p>`;
                } else {
                    items.forEach((item, iIdx) => {
                        const entry = stageData[item] || {};
                        const isEmpty = isContentEmptyOrDefault(entry.content);
                        const statusTag = isEmpty ? '<span class="status-empty">[空白未編輯]</span>' : '';
                        
                        contentHtml += `
                            <div class="item-block">
                                <h2 class="item-title">${iIdx + 1}. ${item} ${statusTag}</h2>
                                <div class="item-meta">
                                    ${entry.code ? `<span><b>項目編號：</b>${entry.code}</span>` : ''}
                                    ${entry.updateDate ? `<span><b>最後更新：</b>${entry.updateDate}</span>` : ''}
                                    ${entry.author ? `<span><b>發布單位：</b>${entry.author}</span>` : ''}
                                </div>
                                <div class="item-content manual-content">
                                    ${entry.content || '<p style="color: #94a3b8; font-style: italic;">暫無指引細節內文</p>'}
                                </div>
                            </div>
                        `;
                    });
                }
                contentHtml += `</div>`;
            });

            // 整合共享列印 CSS 至 PDF 樣式中，去除大量重複碼
            const style = `
                <style>
                    ${SHARED_PRINT_CSS}
                    body {
                        padding: 40px;
                    }
                    .stage-section {
                        margin-bottom: 40px;
                    }
                    .stage-header {
                        font-size: 18px;
                        font-weight: 900;
                        color: #0d9488;
                        background-color: #f0fdfa;
                        border: 1px solid #99f6e4;
                        padding: 10px 18px;
                        border-radius: 8px;
                        display: inline-block;
                        margin-bottom: 12px;
                    }
                    .stage-divider {
                        border: none;
                        border-top: 3px double #0d9488;
                        margin-top: 5px;
                        margin-bottom: 25px;
                    }
                    .item-block {
                        margin-bottom: 35px;
                        page-break-inside: avoid;
                    }
                    .item-title {
                        font-size: 15px;
                        font-weight: 700;
                        color: #1e3a8a;
                        border-left: 5px solid #2563eb;
                        padding-left: 12px;
                        margin-top: 20px;
                        margin-bottom: 10px;
                    }
                    .status-empty {
                        font-size: 11px;
                        color: #f59e0b;
                        font-weight: 500;
                        margin-left: 8px;
                    }
                    .item-meta {
                        font-size: 11px;
                        color: #64748b;
                        margin-bottom: 12px;
                        display: flex;
                        gap: 15px;
                        background-color: #f8fafc;
                        padding: 6px 12px;
                        border-radius: 4px;
                        border: 1px solid #f1f5f9;
                    }
                    @media print {
                        body {
                            padding: 20px;
                        }
                    }
                </style>
            `;

            printWin.document.write(`
                <html>
                <head>
                    <title>非工程專責機關辦理工程參考手冊 - 範圍匯出</title>
                    ${style}
                </head>
                <body>
                    <div style="text-align: center; margin-bottom: 30px; page-break-after: avoid;">
                        <h1 style="font-size: 24px; font-weight: 900; margin-bottom: 5px; color: #0f172a;">非工程專責機關辦理工程參考手冊</h1>
                        <p style="font-size: 13px; color: #64748b;">動態整合匯出文件 (彙整日期：2026-05-22)</p>
                    </div>
                    ${contentHtml}
                </body>
                </html>
            `);
            printWin.document.close();
            printWin.focus();

            setTimeout(() => {
                printWin.print();
                printWin.close();
            }, 350);
        }


        /**
         * 系統待命空值狀態引導頁面
         */
        function renderEmptyDatabaseLanding() {
            const col1 = dom.col1;
            const col2 = dom.col2;
            const col3 = dom.col3;
            const mobileL1 = dom.mobileL1;
            
            if (col1) col1.innerHTML = `<div class="p-4 text-center text-xs text-slate-400 dark:text-slate-505">資料載入失敗</div>`;
            if (col2) col2.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-slate-400 text-xs py-12">
                    <i data-lucide="alert-triangle" class="w-8 h-8 text-slate-300 dark:text-slate-700 mb-2"></i>
                    <span>無法取得手冊資料</span>
                </div>`;
            if (col3) col3.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-center py-24 space-y-4">
                    <div class="p-4 bg-amber-50 dark:bg-amber-950/20 rounded-full border border-amber-200/50 dark:border-amber-800">
                        <i data-lucide="wifi-off" class="w-12 h-12 text-amber-400"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-slate-700 dark:text-slate-300">手冊資料載入失敗</h3>
                        <p class="text-xs text-slate-400 dark:text-slate-505 max-w-sm mt-1.5 leading-relaxed">
                            請確認網路連線後重新整理頁面，或稍後再試。
                        </p>
                    </div>
                </div>`;
            if (mobileL1) mobileL1.innerHTML = `
                <div class="p-8 text-center text-slate-400 text-xs space-y-3">
                    <i data-lucide="wifi-off" class="w-12 h-12 mx-auto text-amber-400"></i>
                    <p>手冊資料載入失敗，請確認網路後重新整理頁面。</p>
                </div>`;
            lucide.createIcons();
        }

        /**
         * 非阻塞式 Toast 通知發布器
         */
        function showNotification(title, text) {
            const notifyEl = document.createElement('div');
            notifyEl.className = 'fixed top-6 right-6 z-50 p-4 bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-700 max-w-sm flex flex-col gap-1 transition-all transform translate-y-2 opacity-0 duration-300';
            notifyEl.innerHTML = `
                <div class="font-bold text-xs uppercase text-emerald-400 tracking-wider">${title}</div>
                <div class="text-xs text-slate-300 leading-relaxed">${text}</div>
            `;
            document.body.appendChild(notifyEl);
            setTimeout(() => {
                notifyEl.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                notifyEl.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => { notifyEl.remove(); }, 300);
            }, 4500);
        }

        // =======================================================
        // 【8. 系統載入與事件繫結】
        // =======================================================
        window.onload = async function() {
            initDomCache();
            initTheme();

            // 自動從伺服器（或 Service Worker 快取）載入手冊資料
            try {
                const res = await fetch('./data/manual.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const json = await res.json();
                mergeDatabase(json);

                // 更新狀態列
                if (dom.dbStatusLabel) dom.dbStatusLabel.textContent = '資料庫狀態：手冊已載入';
                if (dom.statusPulse) {
                    dom.statusPulse.classList.remove('bg-amber-500');
                    dom.statusPulse.classList.add('bg-emerald-500');
                }
            } catch(err) {
                console.error('手冊資料載入失敗：', err);
                if (dom.dbStatusLabel) dom.dbStatusLabel.textContent = '資料庫狀態：載入失敗，請重新整理';
                if (dom.statusPulse) {
                    dom.statusPulse.classList.remove('bg-emerald-500');
                    dom.statusPulse.classList.add('bg-amber-500');
                }
            }

            const stages = Object.keys(mockCloudDatabase);
            if (stages.length > 0) {
                state.selectedL1 = stages[0];
                renderL1();
                renderL2();
                renderMobileL1();
            } else {
                renderEmptyDatabaseLanding();
            }

            // 超連結事件委派防護
            const handleAnchorClick = function(e) {
                const anchor = e.target.closest('a');
                if (anchor && anchor.getAttribute('href')) {
                    e.preventDefault();
                    window.open(anchor.getAttribute('href'), '_blank', 'noopener,noreferrer');
                }
            };
            
            const c3 = dom.col3;
            const mc3 = dom.mobileL3;
            if (c3) c3.addEventListener('click', handleAnchorClick);
            if (mc3) mc3.addEventListener('click', handleAnchorClick);

            lucide.createIcons();
        };
    </script>
</body>
</html>
